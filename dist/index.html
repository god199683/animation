<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature Animation Studio</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Nanum+Gothic:wght@400;700;800&display=swap');
:root{--bg:#090d1b;--card:#111a30;--line:#405273;--ink:#f3f7ff;--sub:#a9b8d7;--a:#76f4e4;--p:#fb91cd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 5%,#2a4872,transparent 30rem),radial-gradient(circle at 85% 100%,#4b295c,transparent 38rem),var(--bg);color:var(--ink);font-family:'Nanum Gothic',sans-serif}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0 56px}.top{display:flex;justify-content:space-between;margin-bottom:34px}.brand{font:13px 'DM Mono';letter-spacing:.15em;color:var(--a)}.state{font:11px 'DM Mono';color:var(--sub)}.state i{display:inline-block;width:7px;height:7px;background:var(--a);border-radius:50%;margin-right:6px}h1{font-size:clamp(2.3rem,5vw,4.6rem);letter-spacing:-.08em;line-height:1.12;margin:0}h1 em{font-style:normal;background:linear-gradient(105deg,var(--a),#a9b2ff,var(--p));color:transparent;background-clip:text}.lead{color:var(--sub);line-height:1.75;margin:17px 0 30px}.benches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.bench{padding:18px;border:1px solid var(--line);border-radius:16px;background:#121c35;color:var(--ink);text-align:left;font-family:inherit;cursor:pointer;transition:.2s}.bench:hover,.bench.active{border-color:var(--a);background:#20345c;transform:translateY(-2px)}.bench b{display:block;margin:7px 0;font-size:.94rem}.bench small{font-size:.75rem;color:var(--sub);line-height:1.5}.grid{display:grid;grid-template-columns:1fr 1.1fr;gap:16px}.panel{background:#101930ed;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px #0007}h2{font-size:1rem;margin:0 0 17px}.field{margin-bottom:16px}.field label{font-size:.8rem;font-weight:700;display:block;margin-bottom:7px}.field label span{float:right;font:10px 'DM Mono';color:var(--a)}textarea,select{width:100%;border:1px solid #3b4e73;background:#091124;color:var(--ink);border-radius:10px;padding:12px;font:14px 'Nanum Gothic';outline:none}textarea{height:112px;resize:vertical;line-height:1.6}textarea:focus,select:focus{border-color:var(--a)}.hint{color:var(--sub);font-size:.73rem;line-height:1.55;margin-top:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.go{width:100%;padding:16px;border:0;border-radius:11px;background:linear-gradient(105deg,var(--a),#acb5ff,var(--p));color:#091224;font-weight:800;font-size:1rem;cursor:pointer}.output{position:relative}.copy{float:right;border:1px solid var(--line);border-radius:8px;background:#1c2947;color:var(--ink);padding:8px 10px;font:11px 'DM Mono';cursor:pointer}pre{clear:both;white-space:pre-wrap;min-height:395px;margin:0;padding:16px;border:1px solid #2b3c60;border-radius:12px;background:#080f20;color:#dce7ff;font:12.5px/1.82 'DM Mono'}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{padding:6px 10px;border-radius:18px;background:#202d4c;color:#c8d3ef;font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--a);color:#081223;padding:11px 15px;border-radius:8px;font-weight:bold;font-size:.83rem;transition:.25s}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){.state{display:none}.benches,.grid,.row{grid-template-columns:1fr}pre{min-height:330px}.bench{padding:14px}}
</style></head><body><main><header class="top"><div class="brand">CREATURE ANIMATION / PROMPT STUDIO</div><div class="state"><i></i>RANDOM ENGINE READY</div></header><h1>주제에 맞춰 만드는<br><em>3D 생명체 애니메이션</em></h1><p class="lead">유리 생명체에 한정되지 않습니다. 주제를 입력하면 요정·동물·젤리 몬스터·외계 생명체 등 어울리는 캐릭터와 장면을 매번 새롭게 조합합니다.</p><section class="benches"><button class="bench active" data-kind="omakase">🍣<b>오마카세 먹방</b><small>작은 생명체의 미니 코스 요리 리액션</small></button><button class="bench" data-kind="cooking">🫧<b>판타지 요리</b><small>마법 재료로 만드는 작은 요리 장면</small></button><button class="bench" data-kind="free">✦<b>자유 주제</b><small>원하는 애니메이션 이야기를 직접 입력</small></button></section><section class="grid"><aside class="panel"><h2 id="title">오마카세 먹방 설정</h2><div class="field"><label>애니메이션 주제 <span>YOUR STORY</span></label><textarea id="topic">작은 유리 생명체의 오마카세 먹방</textarea><div class="hint" id="hint">예: “아기 여우 정령이 벚꽃 젤리를 먹으며 꼬리가 빛나는 장면”</div></div><div class="row"><div class="field"><label>영상 길이</label><select id="duration"><option>8–10 seconds</option><option>5–6 seconds</option><option>12–15 seconds</option></select></div><div class="field"><label>감정 톤</label><select id="mood"><option value="playful">장난스럽고 귀엽게</option><option value="dreamy">몽환적이고 섬세하게</option><option value="premium">고급스럽고 시네마틱하게</option></select></div></div><button class="go" id="go">3D 애니메이션 프롬프트 생성</button></aside><article class="panel output"><button class="copy" id="copy">COPY PROMPT</button><h2>생성된 영상 프롬프트</h2><pre id="prompt"></pre><div class="chips" id="chips"></div></article></section></main><div class="toast" id="toast">프롬프트를 복사했어요.</div>
<script>
const sets={omakase:{name:'오마카세 먹방 설정',sample:'작은 유리 생명체의 오마카세 먹방',hint:'예: “아기 여우 정령이 벚꽃 젤리를 먹으며 꼬리가 빛나는 장면”',food:['salmon nigiri','jewel-like sea urchin sushi','translucent yuzu jelly','a tiny wagyu sushi course'],place:'an intimate miniature omakase counter'},cooking:{name:'판타지 요리 설정',sample:'젤리 생명체가 별빛 라면을 요리한다',hint:'예: “젤리 생명체가 투명한 딸기 케이크를 굽는 장면”',food:['starlight ramen','a crystal strawberry tart','floating vegetable soup','a rainbow candy sculpture'],place:'a miniature fantasy kitchen with glowing cookware'},free:{name:'자유 주제 설정',sample:'',hint:'예: “비 오는 날, 작은 용이 레몬 타르트를 먹는다”',food:['a glowing fruit dessert','jewel-colored noodles','a magical seasonal delicacy'],place:'a magical miniature set tailored to the requested theme'}};
const creatures=['a hand-blown translucent glass creature','a tiny fox spirit with shimmering fur','a round jelly creature with a glowing core','a miniature axolotl-like forest sprite','a small alien with iridescent skin','a fluffy cloud creature with tiny wings','a baby dragon with pearlescent scales'];const changes=['its belly fills with moving pearly light','tiny glowing bubbles circle around its body','small crystal blossoms emerge and float away','its ears and tail briefly change color','a warm magical glow travels through its silhouette'];let kind='omakase';const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)];function make(){let s=sets[kind],idea=$('topic').value.trim()||'a charming tiny creature story',m={playful:'playful, adorable, and full of gentle curiosity',dreamy:'dreamy, delicate, and softly magical',premium:'refined, cinematic, and quietly luxurious'}[$('mood').value];$('prompt').textContent=`Create a fully 3D animated vertical 9:16 short-form video based on this concept: “${idea}.”\n\nFeature ${pick(creatures)}, selected to suit the requested theme. Give it expressive eyes, a distinctive silhouette, believable 3D weight, and tactile material detail. The scene takes place at ${s.place}. The character interacts with ${pick(s.food)}. As the moment unfolds, ${pick(changes)}.\n\nThe character reacts in a ${m} way. Premium 3D character animation, macro cinematic close-up, physically based materials appropriate to the chosen creature, beautiful reflections, delicate ASMR food and environmental sound design, shallow depth of field, soft volumetric lighting, detailed miniature set, smooth animation. One continuous ${$('duration').value} shot. No dialogue, no on-screen text, no watermark, no 2D illustration, no horror, no injury.`;$('chips').innerHTML=['3D animation','varied creature','9:16 short','randomized'].map(x=>`<span class="chip">${x}</span>`).join('')}function choose(k){kind=k;let s=sets[k];document.querySelectorAll('.bench').forEach(b=>b.classList.toggle('active',b.dataset.kind===k));$('title').textContent=s.name;$('topic').value=s.sample;$('hint').textContent=s.hint;make()}document.querySelectorAll('.bench').forEach(b=>b.onclick=()=>choose(b.dataset.kind));$('go').onclick=make;$('copy').onclick=async()=>{await navigator.clipboard.writeText($('prompt').textContent);$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)};make();
</script></body></html>
