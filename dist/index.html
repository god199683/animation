<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>GLASS CREATURE STUDIO</title><link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='14' fill='%2376f4e4'/%3E%3C/svg%3E"><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Nanum+Gothic:wght@400;700;800&display=swap');:root{--bg:#090d1b;--card:#111a30;--line:#405273;--ink:#f3f7ff;--sub:#9aaacd;--a:#76f4e4;--p:#fb91cd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 13% 5%,#2a4872 0,transparent 30rem),radial-gradient(circle at 85% 100%,#4b295c 0,transparent 38rem),var(--bg);color:var(--ink);font-family:'Nanum Gothic',sans-serif}main{width:min(1220px,calc(100% - 32px));margin:auto;padding:34px 0 56px}.top{display:flex;justify-content:space-between;margin-bottom:36px}.brand{font:13px 'DM Mono';letter-spacing:.17em;color:var(--a)}.live{font:11px 'DM Mono';color:var(--sub)}.live b{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--a);margin-right:7px;box-shadow:0 0 14px var(--a)}h1{font-size:clamp(2.25rem,5vw,4.7rem);line-height:1.11;letter-spacing:-.08em;margin:0;max-width:850px}h1 strong{background:linear-gradient(105deg,var(--a),#9da8ff 50%,var(--p));color:transparent;background-clip:text}.lead{color:var(--sub);line-height:1.75;margin:18px 0 33px}.workbenches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.bench{border:1px solid var(--line);background:#121c35;color:var(--ink);padding:18px;border-radius:16px;text-align:left;cursor:pointer;transition:.2s;font-family:inherit}.bench:hover,.bench.active{border-color:var(--a);transform:translateY(-2px);background:#20345c}.icon{font-size:25px;display:block;margin-bottom:10px}.bench b{font-size:.94rem}.bench small{display:block;font-size:.75rem;line-height:1.5;color:var(--sub);margin-top:6px}.studio{display:grid;grid-template-columns:1fr 1.08fr;gap:16px}.panel{border:1px solid #40527399;border-radius:20px;background:#101930e8;box-shadow:0 18px 65px #0007}.controls,.output{padding:24px}h2{font-size:1rem;margin:0 0 17px}.topic{width:100%;height:114px;resize:vertical;border-radius:12px;border:1px solid #3b4e73;background:#091124;color:var(--ink);padding:14px;font:14px/1.65 'Nanum Gothic';outline:none}.topic:focus,select:focus{border-color:var(--a)}.hint{font-size:.73rem;color:var(--sub);line-height:1.55;margin:8px 1px 19px}.two{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{margin-bottom:17px}.field label{display:block;font-size:.78rem;font-weight:700;margin-bottom:7px}.field label span{float:right;color:var(--a);font:10px 'DM Mono'}select{width:100%;background:#111a30;color:var(--ink);border:1px solid #3b4e73;border-radius:9px;padding:11px;font:13px 'Nanum Gothic'}.generate{width:100%;border:0;border-radius:11px;padding:16px;background:linear-gradient(105deg,var(--a),#aeb5ff 53%,var(--p));color:#0d1326;font-weight:800;font-size:1rem;cursor:pointer}.output{position:relative}.output:after{content:'3D';position:absolute;right:18px;top:15px;font:10px 'DM Mono';letter-spacing:.12em;color:var(--a);border:1px solid #76f4e866;padding:6px;border-radius:5px}.output-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.copy{border:1px solid #405273;background:#1c2947;color:var(--ink);border-radius:8px;padding:9px 12px;font:11px 'DM Mono';cursor:pointer}pre{margin:0;white-space:pre-wrap;min-height:390px;border:1px solid #2b3c60;background:#080f20;border-radius:12px;padding:17px;color:#dae6ff;font:12.5px/1.85 'DM Mono'}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{background:#202d4c;border-radius:20px;color:#bfcbec;padding:6px 10px;font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);padding:11px 15px;border-radius:8px;background:var(--a);color:#091224;font-weight:800;font-size:.82rem;transition:.25s}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){main{padding-top:25px}.live{display:none}.workbenches,.studio,.two{grid-template-columns:1fr}.bench{padding:14px}.icon{display:inline;margin-right:8px}pre{min-height:335px}}</style></head><body><main><header class="top"><div class="brand">GLASS CREATURE / 3D PROMPT STUDIO</div><div class="live"><b></b>ANIMATION WORKSHOP</div></header><h1>입력한 주제로 만드는<br><strong>3D 유리 생명체 애니메이션</strong></h1><p class="lead">이야기 한 줄을 적고 작업대를 고르면, 캐릭터 동작·장면·변신·카메라 연출을 무작위로 조합한 영상 생성 프롬프트가 매번 새로 만들어집니다.</p><section class="workbenches"><button class="bench active" data-type="omakase"><span class="icon">🍣</span><b>오마카세 먹방 작업대</b><small>미니 코스 요리와 귀여운 리액션</small></button><button class="bench" data-type="cooking"><span class="icon">🫧</span><b>유리 요리 작업대</b><small>생명체가 투명한 재료를 요리하는 장면</small></button><button class="bench" data-type="free"><span class="icon">✦</span><b>자유 주제 작업대</b><small>원하는 애니메이션 이야기를 직접 입력</small></button></section><section class="studio"><aside class="panel controls"><h2 id="stationTitle">오마카세 먹방 설정</h2><div class="field"><label for="topic">애니메이션 주제 <span>YOUR STORY</span></label><textarea id="topic" class="topic">작은 유리 생명체의 오마카세 먹방</textarea><div class="hint" id="hint">예: “벚꽃 젤리를 먹으며 몸 안에 꽃잎이 차오르는 장면”</div></div><div class="two"><div class="field"><label>영상 길이</label><select id="duration"><option>8–10 seconds</option><option>5–6 seconds</option><option>12–15 seconds</option></select></div><div class="field"><label>감정 톤</label><select id="mood"><option value="playful">장난스럽고 귀엽게</option><option value="dreamy">몽환적이고 섬세하게</option><option value="premium">고급스럽고 시네마틱하게</option></select></div></div><button class="generate" id="go">3D 애니메이션 프롬프트 생성</button></aside><article class="panel output"><div class="output-head"><h2>생성된 프롬프트</h2><button class="copy" id="copy">COPY PROMPT</button></div><pre id="prompt"></pre><div id="chips" class="chips"></div></article></section></main><div class="toast" id="toast">프롬프트를 복사했어요.</div><script>const stations={omakase:{title:'오마카세 먹방 설정',hint:'예: “벚꽃 젤리를 먹으며 몸 안에 꽃잎이 차오르는 장면”',food:['a hand-formed piece of salmon nigiri','a jewel-like sea urchin gunkan','a translucent yuzu jelly','a tiny course of wagyu sushi'],change:['its belly fills with pearly moving light','soft bubbles and miniature fish drift through its glass torso','delicate prism fins unfold behind its ears'],place:'an intimate omakase counter with polished dark wood and tiny ceramic plates'},cooking:{title:'유리 요리 설정',hint:'예: “유리 생명체가 투명한 딸기 케이크를 굽는 장면”',food:['a pot of transparent starlight ramen','a miniature crystal strawberry tart','a glassy soup filled with floating vegetables'],change:['the ingredients dissolve into colored light inside its body','its hands briefly become glowing glass utensils','tiny crystalline steam clouds gather around its head'],place:'a miniature futuristic glass kitchen with softly glowing cookware'},free:{title:'자유 주제 설정',hint:'예: “비 오는 날, 유리 생명체가 작은 레몬 타르트를 먹는다”',food:['a glowing fruit dessert','a tiny bowl of jewel-colored noodles','a hand-crafted candy sculpture'],change:['iridescent bubbles begin to circulate through its body','its glass form gently changes color and shape','small crystal blossoms emerge and float away'],place:'a magical miniature set tailored to the requested theme'}};let type='omakase';const $=id=>document.getElementById(id),pick=a=>a[Math.floor(Math.random()*a.length)];function setStation(t){type=t;document.querySelectorAll('.bench').forEach(b=>b.classList.toggle('active',b.dataset.type===t));let s=stations[t];$('stationTitle').textContent=s.title;$('topic').value=t==='omakase'?'작은 유리 생명체의 오마카세 먹방':t==='cooking'?'유리 생명체가 별빛 유리 라면을 요리한다':'';$('hint').textContent=s.hint;make()}function make(){let s=stations[type],idea=$('topic').value.trim()||'a charming glass creature story',food=pick(s.food),change=pick(s.change),m={playful:'playful, adorable, and full of gentle curiosity',dreamy:'dreamy, delicate, and softly magical',premium:'refined, cinematic, and quietly luxurious'}[$('mood').value];$('prompt').textContent=`Create a fully 3D animated vertical 9:16 short-form video based on this concept: “${idea}.”\n\nFeature one tiny adorable living creature made from hand-blown translucent glass. Its body has realistic refraction, caustics, subtle internal liquid motion, and expressive tiny eyes. The scene takes place at ${s.place}. The creature interacts with ${food}. As the moment unfolds, ${change}.\n\nThe creature moves with believable 3D weight and soft charm; its reaction is ${m}. Premium 3D character animation, macro cinematic close-up, physically based glass materials, beautiful reflections, delicate ASMR food and glass-tapping sound design, shallow depth of field, soft volumetric studio lighting, detailed miniature set, smooth animation. One continuous ${$('duration').value} shot. No dialogue, no on-screen text, no watermark, no 2D illustration, no horror, no broken glass, no injury.`;$('chips').innerHTML=[type==='omakase'?'오마카세':type==='cooking'?'유리 요리':'자유 주제','3D animation','PBR glass','9:16 short','randomized'].map(x=>`<span class="chip">${x}</span>`).join('')}document.querySelectorAll('.bench').forEach(b=>b.onclick=()=>setStation(b.dataset.type));$('go').onclick=make;$('copy').onclick=async()=>{await navigator.clipboard.writeText($('prompt').textContent);$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1600)};make();</script></body></html>
