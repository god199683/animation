<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Creature Animation Studio</title><style>@import url('https://fonts.googleapis.com/css2?family=DM+Mono&family=Nanum+Gothic:wght@400;700;800&display=swap');:root{--bg:#090d1b;--card:#111a30;--line:#405273;--ink:#f3f7ff;--sub:#a9b8d7;--a:#76f4e4;--p:#fb91cd}*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 12% 5%,#2a4872,transparent 30rem),radial-gradient(circle at 85% 100%,#4b295c,transparent 38rem),var(--bg);color:var(--ink);font-family:'Nanum Gothic',sans-serif}main{width:min(1180px,calc(100% - 32px));margin:auto;padding:36px 0 56px}.top{display:flex;justify-content:space-between;margin-bottom:34px}.brand{font:13px 'DM Mono';letter-spacing:.15em;color:var(--a)}.state{font:11px 'DM Mono';color:var(--sub)}.state i{display:inline-block;width:7px;height:7px;background:var(--a);border-radius:50%;margin-right:6px}h1{font-size:clamp(2.3rem,5vw,4.6rem);letter-spacing:-.08em;line-height:1.12;margin:0}h1 em{font-style:normal;background:linear-gradient(105deg,var(--a),#a9b2ff,var(--p));color:transparent;background-clip:text}.lead{color:var(--sub);line-height:1.75;margin:17px 0 30px}.benches{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:16px}.bench{padding:18px;border:1px solid var(--line);border-radius:16px;background:#121c35;color:var(--ink);text-align:left;font-family:inherit;cursor:pointer;transition:.2s}.bench:hover,.bench.active{border-color:var(--a);background:#20345c;transform:translateY(-2px)}.bench b{display:block;margin:7px 0;font-size:.94rem}.bench small{font-size:.75rem;color:var(--sub);line-height:1.5}.grid{display:grid;grid-template-columns:.8fr 1.2fr;gap:16px}.panel{background:#101930ed;border:1px solid var(--line);border-radius:20px;padding:24px;box-shadow:0 20px 60px #0007}h2{font-size:1rem;margin:0 0 17px}.field{margin-bottom:16px}.field label{font-size:.8rem;font-weight:700;display:block;margin-bottom:7px}.field label span{float:right;font:10px 'DM Mono';color:var(--a)}textarea,select{width:100%;border:1px solid #3b4e73;background:#091124;color:var(--ink);border-radius:10px;padding:12px;font:14px 'Nanum Gothic';outline:none}textarea{height:112px;resize:vertical;line-height:1.6}textarea:focus,select:focus{border-color:var(--a)}.hint{color:var(--sub);font-size:.73rem;line-height:1.55;margin-top:7px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.go{width:100%;padding:16px;border:0;border-radius:11px;background:linear-gradient(105deg,var(--a),#acb5ff,var(--p));color:#091224;font-weight:800;font-size:1rem;cursor:pointer}.outputs{display:grid;gap:14px}.out{position:relative}.copy{float:right;border:1px solid var(--line);border-radius:8px;background:#1c2947;color:var(--ink);padding:8px 10px;font:11px 'DM Mono';cursor:pointer}pre{clear:both;white-space:pre-wrap;margin:0;padding:15px;border:1px solid #2b3c60;border-radius:12px;background:#080f20;color:#dce7ff;font:12px/1.75 'DM Mono'}.video pre{min-height:270px}.audio pre{min-height:160px;border-color:#644678}.audio h2{color:#f4b4da}.chips{display:flex;flex-wrap:wrap;gap:7px;margin-top:13px}.chip{padding:6px 10px;border-radius:18px;background:#202d4c;color:#c8d3ef;font-size:11px}.toast{position:fixed;bottom:24px;left:50%;transform:translate(-50%,80px);background:var(--a);color:#081223;padding:11px 15px;border-radius:8px;font-weight:bold;font-size:.83rem;transition:.25s}.toast.show{transform:translate(-50%,0)}@media(max-width:760px){.state{display:none}.benches,.grid,.row{grid-template-columns:1fr}.video pre{min-height:245px}}</style></head><body><main><header class="top"><div class="brand">CREATURE ANIMATION / PROMPT STUDIO</div><div class="state"><i></i>VIDEO + SOUND ENGINE</div></header><h1>주제에 맞춰 만드는<br><em>3D 애니메이션과 사운드</em></h1><p class="lead">캐릭터·장면·카메라가 포함된 영상 프롬프트와, 배경음·효과음·ASMR로 구성된 사운드 프롬프트를 한 번에 만듭니다.</p><section class="benches"><button class="bench active" data-kind="omakase">🍣<b>오마카세 먹방</b><small>미니 코스 요리와 만족스러운 ASMR</small></button><button class="bench" data-kind="cooking">🫧<b>판타지 요리</b><small>마법 재료와 조리 효과음</small></button><button class="bench" data-kind="free">✦<b>자유 주제</b><small>원하는 애니메이션 이야기를 직접 입력</small></button></section><section class="grid"><aside class="panel"><h2 id="title">오마카세 먹방 설정</h2><div class="field"><label>애니메이션 주제 <span>YOUR STORY</span></label><textarea id="topic">작은 유리 생명체의 오마카세 먹방</textarea><div class="hint" id="hint">예: “아기 여우 정령이 벚꽃 젤리를 먹으며 꼬리가 빛나는 장면”</div></div><div class="row"><div class="field"><label>영상 길이</label><select id="duration"><option>8–10 seconds</option><option>5–6 seconds</option><option>12–15 seconds</option></select></div><div class="field"><label>감정 톤</label><select id="mood"><option value="playful">장난스럽고 귀엽게</option><option value="dreamy">몽환적이고 섬세하게</option><option value="premium">고급스럽고 시네마틱하게</option></select></div></div><button class="go" id="go">영상 · 사운드 프롬프트 생성</button></aside><article class="panel outputs"><section class="out video"><button class="copy" data-copy="video">COPY VIDEO</button><h2>3D 영상 프롬프트</h2><pre id="video"></pre></section><section class="out audio"><button class="copy" data-copy="audio">COPY SOUND</button><h2>배경음 · 효과음 프롬프트</h2><pre id="audio"></pre></section><div class="chips" id="chips"></div></article></section></main><div class="toast" id="toast">프롬프트를 복사했어요.</div><script>const sets={omakase:{name:'오마카세 먹방 설정',sample:'작은 유리 생명체의 오마카세 먹방',hint:'예: “아기 여우 정령이 벚꽃 젤리를 먹으며 꼬리가 빛나는 장면”',food:['salmon nigiri','jewel-like sea urchin sushi','translucent yuzu jelly'],place:'an intimate miniature omakase counter',sound:['soft Japanese jazz with brushed percussion','a refined koto and warm room tone','gentle lo-fi jazz with a quiet vinyl texture'],sfx:['delicate chopstick taps, ceramic plate clinks, tiny happy chewing','subtle sushi slicing, a porcelain cup set down, quiet delighted squeaks']},cooking:{name:'판타지 요리 설정',sample:'젤리 생명체가 별빛 라면을 요리한다',hint:'예: “젤리 생명체가 투명한 딸기 케이크를 굽는 장면”',food:['starlight ramen','a crystal strawberry tart','floating vegetable soup'],place:'a miniature fantasy kitchen with glowing cookware',sound:['sparkling ambient electronic music','gentle whimsical orchestral music','dreamy music-box melody and warm pads'],sfx:['magic chimes, bubbling broth, a tiny wooden spoon stirring','soft crystal clinks, a gentle oven chime, shimmering magical sparkles']},free:{name:'자유 주제 설정',sample:'',hint:'예: “비 오는 날, 작은 용이 레몬 타르트를 먹는다”',food:['a glowing fruit dessert','jewel-colored noodles','a magical seasonal delicacy'],place:'a magical miniature set tailored to the requested theme',sound:['cinematic ambient music with a gentle melodic hook','dreamy instrumental music with soft textural layers','playful magical background music'],sfx:['subtle character footsteps, soft environmental ambience, delicate magical accents','tactile prop sounds, gentle whooshes, and a warm room tone']}};const creatures=['a hand-blown translucent glass creature','a tiny fox spirit with shimmering fur','a round jelly creature with a glowing core','a miniature forest sprite','a small alien with iridescent skin','a baby dragon with pearlescent scales'];const changes=['its belly fills with moving pearly light','tiny glowing bubbles circle around its body','small crystal blossoms emerge and float away','its ears and tail briefly change color'];let kind='omakase';const $=x=>document.getElementById(x),pick=a=>a[Math.floor(Math.random()*a.length)];function make(){let s=sets[kind],idea=$('topic').value.trim()||'a charming tiny creature story',m={playful:'playful and adorable',dreamy:'dreamy and softly magical',premium:'refined and cinematic'}[$('mood').value],duration=$('duration').value;$('video').textContent=`Create a fully 3D animated vertical 9:16 short-form video based on: “${idea}.” Feature ${pick(creatures)}, selected to suit the theme. Give it expressive eyes, believable 3D weight, and tactile material detail. The scene is ${s.place}; the character interacts with ${pick(s.food)}. As the moment unfolds, ${pick(changes)}. Its reaction is ${m}. Premium 3D character animation, macro cinematic close-up, physically based materials, shallow depth of field, soft volumetric lighting, detailed miniature set, smooth animation. One continuous ${duration} shot. No dialogue, no on-screen text, no watermark, no 2D illustration, no horror.`;$('audio').textContent=`Create an audio bed for a ${duration} vertical 3D animated short based on: “${idea}.” Background music: ${pick(s.sound)}, light and unobtrusive, timed to the character’s reactions. Sound effects: ${pick(s.sfx)}. Add gentle spatial ambience and clean, satisfying ASMR detail. No vocals, no spoken words, no abrupt loud sounds, no copyright-identifiable melody.`;$('chips').innerHTML=['3D animation','varied creature','BGM + SFX','9:16 short','randomized'].map(x=>`<span class="chip">${x}</span>`).join('')}function choose(k){kind=k;let s=sets[k];document.querySelectorAll('.bench').forEach(b=>b.classList.toggle('active',b.dataset.kind===k));$('title').textContent=s.name;$('topic').value=s.sample;$('hint').textContent=s.hint;make()}document.querySelectorAll('.bench').forEach(b=>b.onclick=()=>choose(b.dataset.kind));$('go').onclick=make;document.querySelectorAll('.copy').forEach(b=>b.onclick=async()=>{await navigator.clipboard.writeText($(b.dataset.copy).textContent);$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1500)});make();</script></body></html>
