name: Build Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Publish single-file Windows app
        run: >-
          dotnet publish desktop/CreatureAnimationStudio.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          /p:PublishSingleFile=true
          /p:IncludeNativeLibrariesForSelfExtract=true
          --output publish
      - uses: actions/upload-artifact@v4
        with:
          name: Creature-Animation-Studio-Windows
          path: publish/CreatureAnimationStudio.exe
      - name: Publish latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload latest publish/CreatureAnimationStudio.exe
          --clobber --title "Creature Animation Studio"
          --notes "Latest Windows desktop app build."
        shell: pwsh
