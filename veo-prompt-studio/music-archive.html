<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tailframe · Flow Music 보관함</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">FLOW MUSIC · SEPARATE ARCHIVE</p><h1>TAILFRAME</h1></div>
      <div class="top-actions"><div class="sync"><span id="sync-dot"></span><span id="sync-status">뮤직 보관함 준비 중</span></div><a href="music.html" class="archive-link">Flow Music 생성기</a><a href="index.html" class="archive-link">영상 생성기</a></div>
    </header>
    <section class="archive-page">
      <div class="archive-head"><div><p class="eyebrow">SAVED MUSIC PACKS</p><h2>뮤직 프롬프트 보관함 <span id="archive-count">0</span></h2></div><button id="refresh">새로 고침</button></div>
      <div id="archive-list" class="archive-list"><p class="empty">보관함을 불러오는 중입니다.</p></div>
    </section>
  </main>
  <template id="archive-item"><article class="archive-item"><div><p class="archive-meta"></p><h3></h3><p class="archive-summary"></p></div><div class="archive-actions"><button class="view">열기</button><button class="remove">삭제</button></div></article></template>
  <script src="music-archive.js"></script>
  <script>
    window.addEventListener('load', () => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; script.async = true; script.onload = () => window.connectMusicArchiveSupabase?.(); document.head.appendChild(script); });
  </script>
</body>
</html>
