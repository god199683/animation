<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="VEO 3.1-LIGHT용 4장면 TikTok 프롬프트 생성기" />
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%237c3aed'/%3E%3Cpath d='M16 44c12-25 22-27 32-24-4 13-13 25-32 24Z' fill='%23fbbf24'/%3E%3C/svg%3E" />
  <title>Tailframe · VEO Prompt Studio</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">VEO 3.1-LIGHT · 9:16 SHORTFORM</p><h1>TAILFRAME</h1></div>
      <div class="sync"><span id="sync-dot"></span><span id="sync-status">보관함 연결 준비 중</span></div>
    </header>

    <section class="workspace">
      <aside class="control-panel">
        <div class="panel-heading"><p class="eyebrow">NEW PROMPT</p><h2>다음 변신을 설계하세요</h2><p>비워두면 매번 새로운 조합을 만듭니다.</p></div>
        <label>음식 <input id="food" placeholder="예: 유자 크림 다이후쿠 / 랜덤" /></label>
        <label>장소 <input id="place" placeholder="예: 비 내린 온실 / 랜덤" /></label>
        <label>시작 행동 <input id="action" placeholder="예: 먹고 재채기 / 랜덤" /></label>
        <label>추가 조건 <textarea id="notes" rows="3" placeholder="고정하고 싶은 분위기나 연출"></textarea></label>
        <button id="generate" class="primary">새 프롬프트 생성</button>
        <p id="generation-note" class="hint">보관된 결과와 음식·변신 구조·엔딩을 비교합니다.</p>
      </aside>

      <section class="result-panel">
        <div class="result-head"><div><p class="eyebrow">OUTPUT</p><h2 id="result-title">생성 준비 완료</h2></div><div class="result-actions"><button id="copy" disabled>복사</button><button id="archive" disabled class="accent">보관</button></div></div>
        <pre id="output">왼쪽에서 조건을 입력하거나 그대로 “새 프롬프트 생성”을 눌러 시작하세요.</pre>
      </section>
    </section>

    <section class="archive-section">
      <div class="archive-head"><div><p class="eyebrow">ARCHIVE</p><h2>생성 보관함 <span id="archive-count">0</span></h2></div><button id="refresh">새로 고침</button></div>
      <div id="archive-list" class="archive-list"><p class="empty">아직 보관한 프롬프트가 없습니다.</p></div>
    </section>
  </main>
  <template id="archive-item"><article class="archive-item"><div><p class="archive-meta"></p><h3></h3><p class="archive-summary"></p></div><div class="archive-actions"><button class="view">열기</button><button class="remove">삭제</button></div></article></template>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="app.js"></script>
</body>
</html>
