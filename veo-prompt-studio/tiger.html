<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="아기 백호용 Google Flow 영상 프롬프트 생성기" />
  <title>Tailframe · 아기 백호 생성기</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">BABY WHITE TIGER · 9:16 SHORTFORM</p><h1>TAILFRAME</h1></div>
      <div class="top-actions"><a href="index.html" class="archive-link">여우 영상 생성기</a><a href="archive.html" class="archive-link">영상 보관함</a></div>
    </header>
    <section class="workspace">
      <aside class="control-panel">
        <div class="panel-heading"><p class="eyebrow">BABY TIGER STORY</p><h2>아기 백호 에피소드</h2><p>비워두면 매번 다른 짧은 에피소드를 만듭니다.</p></div>
        <label>에피소드 소재 <input id="theme" placeholder="예: 첫눈, 사라진 리본 / 랜덤" /></label>
        <label>장소 <input id="place" placeholder="예: 대나무 숲 오두막 / 랜덤" /></label>
        <label>추가 조건 <textarea id="notes" rows="4" placeholder="원하는 분위기, 행동, 소품"></textarea></label>
        <button id="generate" class="primary">아기 백호 프롬프트 생성</button>
        <p class="hint">Google Flow에서 클립 1부터 순서대로 만들고, 매번 이전 클립의 마지막 프레임을 다음 Start Frame으로 사용하세요.</p>
      </aside>
      <section class="result-panel">
        <div class="result-head"><div><p class="eyebrow">GOOGLE FLOW · 4 CLIPS</p><h2 id="title">생성 준비 완료</h2></div><div class="result-actions"><button id="copy-all" disabled>전체 복사</button><button data-clip="1" disabled>클립 1 복사</button><button data-clip="2" disabled>클립 2 복사</button><button data-clip="3" disabled>클립 3 복사</button><button data-clip="4" disabled>클립 4 복사</button></div></div>
        <pre id="output">왼쪽에서 조건을 입력하거나 그대로 “아기 백호 프롬프트 생성”을 눌러 시작하세요.</pre>
      </section>
    </section>
  </main>
  <script src="tiger.js"></script>
</body>
</html>
