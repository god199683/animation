<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Tailframe OMNI Prompt Studio 보관함" />
  <title>Tailframe · 보관함</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <main>
    <header class="topbar">
      <div><p class="eyebrow">ARCHIVE · SEPARATE PAGE</p><h1>TAILFRAME</h1></div>
      <div class="top-actions"><div class="sync"><span id="sync-dot"></span><span id="sync-status">보관함 연결 준비 중</span></div><a href="index.html" class="archive-link">영상 생성기</a><a href="drama.html" class="archive-link">드라마 생성기</a></div>
    </header>
    <section class="archive-page">
      <div class="archive-head"><div><p class="eyebrow">SAVED PROMPTS</p><h2>생성 보관함 <span id="archive-count">0</span></h2></div><button id="refresh">새로 고침</button></div>
      <div id="archive-list" class="archive-list"><p class="empty">보관함을 불러오는 중입니다.</p></div>
    </section>
  </main>
  <template id="archive-item"><article class="archive-item"><div><p class="archive-meta"></p><h3></h3><p class="archive-summary"></p></div><div class="archive-actions"><button class="view">열기</button><button class="remove">삭제</button></div></article></template>
  <script src="archive.js"></script>
  <script>
    window.addEventListener('load', () => { const script = document.createElement('script'); script.src = 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2'; script.async = true; script.onload = () => window.connectSupabase?.(); document.head.appendChild(script); });
  </script>
</body>
</html>
